<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한솔아카이브 토스페이먼츠 테스트</title>
<script defer src="https://js.tosspayments.com/v2/standard"></script>
<script defer src="./toss-preview.js"></script>
<main>
  <h1>토스페이먼츠 결제 화면 테스트</h1>
  <p>테스트 금액은 1,000원입니다. 이 화면은 결제 수단과 약관 표시만 확인합니다.</p>
  <form>
    <label for="client-key">주문서형 테스트 클라이언트 키</label>
    <input id="client-key" required pattern="test_gck_[A-Za-z0-9_]+" autocomplete="off" spellcheck="false">
    <button type="submit">테스트 위젯 표시</button>
    <p id="preview-status" role="status"></p>
  </form>
  <div id="payment-methods"></div>
  <div id="agreement"></div>
</main>
</html>
